services:
  - type: web
    name: executive-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10  # pinned: avoids a pydantic-core wheel/build mismatch
      - key: DATABASE_URL
        fromDatabase:
          name: executive-assistant-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false  # set manually in the Render dashboard -- never commit this
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGIN
        sync: false  # set to your Vercel URL after the frontend is deployed
      - key: ADMIN_SEED_SECRET
        sync: false  # set to any random string yourself -- used once to seed
                      # the DB via POST /api/admin/seed on free-tier Render
                      # (no shell access). Safe to leave set indefinitely,
                      # or blank it out after seeding to disable the endpoint.

databases:
  - name: executive-assistant-db
    plan: free